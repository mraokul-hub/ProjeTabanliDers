<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Soru Çözüm Takip Formu (A4 - OCR & Optik Uyumlu)</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;700&display=swap');

        :root {
            --ocr-black: #000000;
            --ocr-line: #111827;
            --ocr-guide: #9ca3af;
            --ocr-bg-light: #f3f4f6;
        }

        * {
            box-sizing: border-box;
            -webkit-print-color-adjust: exact !important;
            print-color-adjust: exact !important;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #e2e8f0;
            margin: 0;
            padding: 20px;
            color: #000;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* EKRAN KONTROL PANELİ (Yazdırmada Gizlenir) */
        .no-print-toolbar {
            width: 210mm;
            background: #1e293b;
            color: #fff;
            padding: 14px 20px;
            border-radius: 12px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 10px 25px rgba(0,0,0,0.15);
            flex-wrap: wrap;
            gap: 12px;
        }

        .toolbar-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .toolbar-info h3 {
            margin: 0;
            font-size: 15px;
            font-weight: 700;
            color: #38bdf8;
        }

        .toolbar-info p {
            margin: 0;
            font-size: 12px;
            color: #94a3b8;
        }

        .toolbar-controls {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .toolbar-btn {
            background: #059669;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12.5px;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            text-decoration: none;
        }

        .toolbar-btn:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        .toolbar-btn-secondary {
            background: #334155;
            color: #e2e8f0;
        }

        .toolbar-btn-secondary:hover {
            background: #475569;
        }

        .toolbar-select {
            background: #0f172a;
            color: #fff;
            border: 1px solid #475569;
            padding: 7px 10px;
            border-radius: 6px;
            font-size: 12.5px;
            font-weight: 500;
            outline: none;
            max-width: 200px;
        }

        .toolbar-status {
            width: 210mm;
            background: #0284c7;
            color: #fff;
            padding: 8px 16px;
            border-radius: 8px;
            margin-bottom: 15px;
            font-size: 12px;
            font-weight: 600;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        /* ── ÇOKLU SAYFA TAŞIYICISI ── */
        #pages-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }

        /* ── A4 SAYFA TASARIMI (210mm x 297mm) ── */
        .a4-page {
            width: 210mm;
            height: 297mm;
            background: #ffffff;
            margin: 0 auto 25px auto;
            padding: 14mm 8mm 13mm 8mm;
            box-shadow: 0 15px 35px rgba(0,0,0,0.12);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        /* ── OPTİK REGİSTRASYON & HİZALAMA İŞARETLERİ (FIDUCIAL MARKERS) ── */
        /* 4 köşede kenar paylarında (margin) yer alır, form başlık ve barkoduna asla temas etmez */
        .fiducial-target {
            position: absolute;
            width: 8mm;
            height: 8mm;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 5;
        }

        .fiducial-target::before {
            content: '';
            width: 3.8mm;
            height: 3.8mm;
            background: #fff;
            border-radius: 50%;
            position: absolute;
        }

        .fiducial-target::after {
            content: '';
            width: 1.6mm;
            height: 1.6mm;
            background: #000;
            border-radius: 50%;
            position: absolute;
        }

        .fiducial-tl { top: 3.5mm; left: 3.5mm; }
        .fiducial-tr { top: 3.5mm; right: 3.5mm; }
        .fiducial-bl { bottom: 3.5mm; left: 3.5mm; }
        .fiducial-br { bottom: 3.5mm; right: 3.5mm; }

        /* Ara Kalibrasyon Çentikleri (Timing Ticks) */
        .tick-h {
            position: absolute;
            width: 3.5mm;
            height: 1.8mm;
            background: #000;
            z-index: 4;
        }
        .tick-v {
            position: absolute;
            width: 1.8mm;
            height: 3.5mm;
            background: #000;
            z-index: 4;
        }

        .tick-top-1 { top: 3.5mm; left: 33%; }
        .tick-top-2 { top: 3.5mm; left: 66%; }
        .tick-bottom-1 { bottom: 3.5mm; left: 33%; }
        .tick-bottom-2 { bottom: 3.5mm; left: 66%; }
        .tick-left-1 { left: 3.5mm; top: 35%; }
        .tick-left-2 { left: 3.5mm; top: 68%; }
        .tick-right-1 { right: 3.5mm; top: 35%; }
        .tick-right-2 { right: 3.5mm; top: 68%; }

        /* ── BAŞLIK & METADATA BÖLÜMÜ (QR BARKOD & DÖNEM ENTEGRELİ) ── */
        .header-section {
            border: 2px solid #000;
            padding: 4px 6px;
            margin-bottom: 2.5mm;
            background: #fff;
            display: flex;
            align-items: stretch;
            gap: 8px;
            position: relative;
            z-index: 10;
        }

        .header-main-col {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }

        .header-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1.5px solid #000;
            padding-bottom: 3px;
            margin-bottom: 4px;
        }

        .header-titles h1 {
            margin: 0;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.3px;
            text-transform: uppercase;
        }

        .header-titles h2 {
            margin: 1px 0 0 0;
            font-size: 9px;
            font-weight: 600;
            color: #374151;
        }

        .header-period-badge {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            border: 1.2px solid #000;
            padding: 2px 6px;
            background: #f8fafc;
            font-family: 'JetBrains Mono', monospace;
            white-space: nowrap;
        }

        .header-period-badge .p-lbl {
            font-size: 8px;
            font-weight: 700;
            color: #111;
        }

        .header-period-badge .p-val {
            font-size: 8.5px;
            font-weight: 800;
            color: #000;
        }

        /* QR Kod & Barkod Kolonu (Sağ Kolon) */
        .header-qr-col {
            width: 76px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-left: 1.5px solid #000;
            padding-left: 6px;
            background: #fff;
            text-align: center;
        }

        .qr-code-box {
            width: 52px;
            height: 52px;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #fff;
        }

        .qr-code-box img, .qr-code-box canvas {
            width: 52px !important;
            height: 52px !important;
            display: block;
        }

        .qr-code-tag {
            font-family: 'JetBrains Mono', monospace;
            font-size: 7px;
            font-weight: 800;
            margin-top: 2px;
            letter-spacing: -0.2px;
            white-space: nowrap;
        }

        .qr-code-hint {
            font-size: 6px;
            font-weight: 700;
            color: #374151;
            letter-spacing: -0.2px;
            text-transform: uppercase;
            white-space: nowrap;
        }

        /* Form Üst Bilgi Kutuları */
        .header-fields {
            display: grid;
            grid-template-columns: 2fr 1fr 1fr 0.9fr;
            gap: 6px;
            align-items: center;
            font-size: 11px;
        }

        .field-group {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .field-lbl {
            font-weight: 700;
            font-size: 9.5px;
            color: #111;
            white-space: nowrap;
        }

        .field-comb {
            display: flex;
            gap: 2px;
        }

        .comb-cell {
            width: 14px;
            height: 16px;
            border: 1.2px solid #000;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10.5px;
            font-weight: 700;
            background: #fff;
        }

        .field-line {
            flex: 1;
            border-bottom: 1.2px dashed #000;
            height: 16px;
            font-size: 11px;
            font-weight: 700;
            padding-left: 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            line-height: 16px;
        }

        /* ── OPTİK SORU ÇÖZÜM TABLOSU ── */
        .table-wrap {
            flex: 1;
            margin-bottom: 2.5mm;
            border: 2px solid #000;
            background: #fff;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        .tracking-table {
            width: 100%;
            height: 100%;
            border-collapse: collapse;
            font-size: 9.5px;
            table-layout: fixed;
        }

        .tracking-table th, 
        .tracking-table td {
            border: 1.2px solid #000;
            padding: 1.5px 2px;
            text-align: left;
            vertical-align: middle;
        }

        .tracking-table th {
            background: var(--ocr-bg-light);
            font-weight: 800;
            text-align: center;
            font-size: 9px;
            padding: 3px 2px;
            letter-spacing: 0.2px;
            line-height: 1.15;
        }

        /* Sütun Genişlikleri: Tarih alanı tam sığacak şekilde 68px'e genişletildi */
        .col-sira { width: 24px; text-align: center !important; font-weight: 700; background: #fafafa; font-size: 9px; }
        .col-tarih { width: 68px; text-align: center !important; padding: 0 2px !important; }
        .col-ders { width: 72px; font-weight: 600; font-size: 9px; padding: 0 2px !important; }
        .col-kaynak { width: auto; font-size: 9px; padding-left: 4px !important; }
        .col-tip { width: 64px; text-align: center !important; }
        .col-dyb { width: 38px; text-align: center !important; }
        .col-os { width: 36px; text-align: center !important; }

        /* Tek Ders Modunda Ders Adı Hücresi */
        .prefilled-ders-name {
            font-size: 8.5px;
            font-weight: 800;
            color: #0f172a;
            display: block;
            text-align: center;
            line-height: 12px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Form Üstü Ders Kutucuğu */
        .header-ders-field {
            border: 1px solid #000;
            background: #fafafa;
            font-weight: 800;
            font-size: 8.5px;
            height: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            letter-spacing: 0.2px;
            padding: 0 4px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* 21 Satır Yüksekliği: Tam A4 sayfasına eşit dağıtılır */
        .tracking-table tbody tr {
            height: calc((297mm - 124mm) / 21);
        }

        /* Tarih Kılavuzu: Taşma yapmaz, tek satırda net sığar */
        .date-box {
            font-family: 'JetBrains Mono', monospace;
            font-size: 8.5px;
            font-weight: 600;
            color: #6b7280;
            letter-spacing: 0.4px;
            white-space: nowrap;
            display: inline-block;
            line-height: 1;
        }

        /* 2 Haneli Segmented Rakam Kutucukları */
        .comb-2 {
            display: inline-flex;
            gap: 1.5px;
            vertical-align: middle;
            justify-content: center;
        }

        .comb-2-cell {
            width: 11px;
            height: 14px;
            border: 1px solid #4b5563;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-family: 'JetBrains Mono', monospace;
            font-size: 9px;
            font-weight: 700;
            background: #fff;
        }

        /* Soru Tipi OMR Balonları (T, YN, K) */
        .omr-bubbles {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 1px;
            font-size: 7.5px;
            font-weight: 700;
            font-family: 'JetBrains Mono', monospace;
        }

        .bubble-tag {
            border: 1px solid #6b7280;
            border-radius: 2px;
            padding: 0 2px;
            line-height: 12px;
            height: 13px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #fff;
            color: #111;
        }

        /* Dotted Yazı Çizgisi */
        .line-guide {
            border-bottom: 1px dashed #cbd5e1;
            height: 12px;
            display: block;
            width: 100%;
        }

        /* ── SAYFA ALTI / OCR KALİBRASYON ŞERİDİ ── */
        .footer-section {
            border: 1.5px solid #000;
            background: #fff;
            padding: 3px 6px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 8px;
            position: relative;
            z-index: 10;
        }

        .footer-left {
            display: flex;
            flex-direction: column;
            gap: 1px;
        }

        .footer-rules {
            font-weight: 700;
            color: #000;
        }

        .footer-sub {
            color: #4b5563;
            font-size: 7.5px;
        }

        /* Gri Skala ve Eşikleme Kalibratörü */
        .calibration-strip {
            display: flex;
            align-items: center;
            gap: 2px;
            border: 1px solid #000;
            padding: 1px;
            background: #fff;
        }

        .cal-box {
            width: 7.5px;
            height: 9.5px;
            border: 0.5px solid #d1d5db;
        }

        .cal-0 { background: #ffffff; }
        .cal-20 { background: #cccccc; }
        .cal-40 { background: #999999; }
        .cal-60 { background: #666666; }
        .cal-80 { background: #333333; }
        .cal-100 { background: #000000; }

        .system-seal {
            font-family: 'JetBrains Mono', monospace;
            font-size: 7.5px;
            font-weight: 700;
            border: 1px solid #000;
            padding: 1px 3.5px;
            background: #fafafa;
            white-space: nowrap;
        }

        /* ── YAZDIRMA (PRINT) ÖZEL AYARLARI ── */
        @media print {
            @page {
                size: A4 portrait;
                margin: 0;
            }
            html, body {
                background: #fff !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            .no-print, .no-print-toolbar, .toolbar-status {
                display: none !important;
            }
            #pages-container {
                width: 100% !important;
                margin: 0 !important;
                padding: 0 !important;
                display: block !important;
            }
            .a4-page {
                box-shadow: none !important;
                margin: 0 !important;
                padding: 14mm 8mm 13mm 8mm !important;
                width: 210mm !important;
                height: 297mm !important;
                page-break-after: always !important;
                break-after: page !important;
                page-break-inside: avoid !important;
                break-inside: avoid !important;
            }
            .a4-page:last-child {
                page-break-after: avoid !important;
                break-after: avoid !important;
            }
        }
    </style>
</head>
<body>

    <!-- EKRAN EYLEM ÇUBUĞU (Yazıcıda Çıkmaz) -->
    <div class="no-print-toolbar no-print">
        <div class="toolbar-info">
            <i class="fas fa-tasks" style="font-size:24px; color:#38bdf8;"></i>
            <div>
                <h3>Soru Çözüm Takip Formu (A4)</h3>
                <p>21 Satırlı Optik &middot; Öğrenciye Özel QR/Barkod &middot; Tarih Kilitli Takip</p>
            </div>
        </div>

        <div class="toolbar-controls">
            <!-- Sınıf Seçimi -->
            <select id="sinif-secici" class="toolbar-select" onchange="onSinifChange(this.value)">
                <option value="">Tüm Sınıflar</option>
            </select>

            <!-- Öğrenci Seçimi -->
            <select id="ogrenci-secici" class="toolbar-select" onchange="onOgrenciChange(this.value)">
                <option value="__ALL__">👥 Tüm Sınıf (Toplu Formlar)</option>
                <option value="">📄 Boş Şablon (Öğrencisiz)</option>
            </select>

            <!-- Ders Seçimi (Seçimli ve Değiştirilebilir) -->
            <select id="ders-secici" class="toolbar-select" onchange="onDersChange(this.value)" style="font-weight:700; color:#fbbf24; border:1px solid #d97706; background:#1e293b;">
                <option value="">📚 Tüm Dersler (Karma / 7 Gün)</option>
                <option value="Matematik">📘 Matematik (Tek Ders / 21 Gün)</option>
                <option value="Türkçe">📕 Türkçe (Tek Ders / 21 Gün)</option>
                <option value="Fen Bilimleri">🔬 Fen Bilimleri (Tek Ders / 21 Gün)</option>
                <option value="Sosyal Bilgiler">🌍 Sosyal Bilgiler (Tek Ders / 21 Gün)</option>
                <option value="İngilizce">🇬🇧 İngilizce (Tek Ders / 21 Gün)</option>
                <option value="Din Kültürü">🕌 Din Kültürü (Tek Ders / 21 Gün)</option>
                <option value="T.C. İnkılap Tarihi">🇹🇷 T.C. İnkılap Tarihi (Tek Ders / 21 Gün)</option>
            </select>

            <!-- Hafta ve Tarih Aralığı Seçici -->
            <div style="display:flex; align-items:center; gap:5px; background:#0f172a; padding:4px 8px; border-radius:6px; border:1px solid #475569;">
                <span style="font-size:11px; color:#94a3b8; font-weight:700;"><i class="fas fa-calendar-alt"></i> Hf:</span>
                <input type="number" id="hafta-no-input" min="1" max="40" value="1" style="width:42px; background:#1e293b; color:#fff; border:1px solid #64748b; padding:3px 5px; border-radius:4px; font-size:11.5px; font-weight:700; text-align:center;" title="Takip Haftası Numarası" onchange="onPeriodChange()">
                <span style="font-size:11px; color:#94a3b8; font-weight:600;">Dönem:</span>
                <input type="date" id="tarih-start-input" class="toolbar-select" style="padding:3px 5px; font-size:11px;" onchange="onPeriodChange()">
                <span style="color:#64748b;">-</span>
                <input type="date" id="tarih-end-input" class="toolbar-select" style="padding:3px 5px; font-size:11px;" onchange="onPeriodChange()">
                <button type="button" class="toolbar-btn toolbar-btn-secondary" style="padding:3px 7px; font-size:10.5px;" onclick="setToolbarPeriodThisWeek()" title="İçinde bulunulan haftayı seç">Bu Hf.</button>
                <button type="button" class="toolbar-btn toolbar-btn-secondary" style="padding:3px 7px; font-size:10.5px;" onclick="setToolbarPeriodNextWeek()" title="Gelecek haftayı seç">Gelecek Hf.</button>
                <button type="button" class="toolbar-btn toolbar-btn-secondary" style="padding:3px 7px; font-size:10.5px; background:#4f46e5; color:#fff;" onclick="setToolbarPeriod21Days()" title="21 Günlük (3 Haftalık) Dönem Belirle">21 Gün</button>
            </div>

            <!-- Tabloya Tarihleri Otomatik Basma Seçeneği -->
            <label style="display:inline-flex; align-items:center; gap:4px; font-size:11px; color:#e2e8f0; cursor:pointer;" title="7 gün x 3 satır = 21 satıra günleri otomatik dağıt">
                <input type="checkbox" id="chk-auto-distribute" checked onchange="renderPages()">
                <span>Tabloya Tarihleri Bas</span>
            </label>

            <!-- Yazdır Butonu -->
            <button class="toolbar-btn" id="btn-print-main" onclick="window.print()">
                <i class="fas fa-print"></i> Formları Yazdır (A4)
            </button>

            <!-- Boş Şablon Butonu -->
            <button class="toolbar-btn toolbar-btn-secondary" onclick="renderBlankOnly()" title="Tek boş şablon gösterir">
                <i class="fas fa-eraser"></i> Boş Şablon
            </button>

            <button class="toolbar-btn toolbar-btn-secondary" onclick="window.close()" title="Sekmeyi Kapat">
                <i class="fas fa-times"></i> Kapat
            </button>
        </div>
    </div>

    <!-- EKRAN BİLGİLENDİRME ŞERİDİ (Yazıcıda Çıkmaz) -->
    <div id="print-status-banner" class="toolbar-status no-print">
        <span id="banner-text"><i class="fas fa-info-circle"></i> Hazırlanıyor...</span>
        <span style="font-size:11px; opacity:0.9;">Yazdırmak için üstteki butona veya Ctrl + P'ye basabilirsiniz.</span>
    </div>

    <!-- ── DİNAMİK A4 SAYFA ALANI ── -->
    <div id="pages-container">
        <!-- JS ile 1 veya Tüm Sınıf İçin Çoklu A4 Sayfası Basılacak -->
    </div>

    <!-- ── FORM OLUŞTURMA VE VERİ ENTEGRASYON SCRIPTİ ── -->
    <script>
        const STORAGE_KEY = 'proje_tabanli_ders_data';
        let allStudents = [];
        let selectedClass = '';
        let selectedStudentNo = '';
        let selectedDers = '';
        let selectedStartDate = '';
        let selectedEndDate = '';
        let selectedWeek = 1;
        let teacherUid = '';

        document.addEventListener('DOMContentLoaded', () => {
            loadStudentData();
            initURLAndSession();
            initPeriodControls();
            populateClassDropdown();
            populateStudentDropdown();
            renderPages();
        });

        // Veritabanı ve Session'dan Öğrenci Verilerini Al
        function loadStudentData() {
            // 1. SessionStorage kontrolü (en güncel anlık veri)
            try {
                const sessionRaw = sessionStorage.getItem('soru_takip_print_students');
                if (sessionRaw) {
                    const parsed = JSON.parse(sessionRaw);
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        allStudents = parsed;
                    }
                }
            } catch (e) {}

            // 2. LocalStorage yedeği
            if (!allStudents.length) {
                try {
                    const raw = localStorage.getItem(STORAGE_KEY);
                    if (raw) {
                        const parsed = JSON.parse(raw);
                        const list = (parsed && (parsed.students || parsed.studentData)) ? (parsed.students || parsed.studentData) : [];
                        if (Array.isArray(list) && list.length > 0) {
                            allStudents = list;
                        }
                    }
                } catch (e) {}
            }
        }

        // Pazartesi ve Pazar Tarihlerini Hesapla (ISO YYYY-MM-DD)
        function getMondayAndSunday(d = new Date()) {
            const date = new Date(d);
            const day = date.getDay();
            const diff = date.getDate() - day + (day === 0 ? -6 : 1);
            const mon = new Date(date.setDate(diff));
            const sun = new Date(mon);
            sun.setDate(mon.getDate() + 6);
            return {
                mon: mon.toISOString().split('T')[0],
                sun: sun.toISOString().split('T')[0]
            };
        }

        // MEB Eğitim Öğretim Takvimine Göre Hafta No Hesapla
        function calculateSchoolWeek(d = new Date()) {
            try {
                const now = new Date(d);
                let sepStart = new Date(now.getFullYear(), 8, 8); // 8 Eylül civarı
                if (now < sepStart && now.getMonth() < 6) {
                    sepStart = new Date(now.getFullYear() - 1, 8, 8);
                }
                const diffTime = now.getTime() - sepStart.getTime();
                const diffDays = Math.floor(diffTime / (1000 * 60 * 60 * 24));
                const week = Math.max(1, Math.min(40, Math.floor(diffDays / 7) + 1));
                return week;
            } catch(e) {
                return 1;
            }
        }

        // Tarihi Türkçe Formatla: DD.MM.YYYY
        function formatDateTR(isoStr) {
            if (!isoStr) return '';
            const parts = isoStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}.${parts[1]}.${parts[0]}`;
            }
            return isoStr;
        }

        // URL ve Session Parametrelerini Çözümle
        function initURLAndSession() {
            const params = new URLSearchParams(window.location.search);
            const classParam = params.get('class') || params.get('sinif') || sessionStorage.getItem('soru_takip_print_class') || '';
            const noParam = params.get('no') || params.get('sid') || sessionStorage.getItem('soru_takip_print_student_no') || '';

            selectedClass = classParam ? decodeURIComponent(classParam) : '';
            selectedStudentNo = noParam ? decodeURIComponent(noParam) : '';

            const dersParam = params.get('ders') || sessionStorage.getItem('soru_takip_print_ders') || '';
            selectedDers = dersParam ? decodeURIComponent(dersParam) : '';

            teacherUid = params.get('uid') || sessionStorage.getItem('soru_takip_print_uid') || '';
            
            selectedStartDate = params.get('start') || sessionStorage.getItem('soru_takip_print_start_date') || '';
            selectedEndDate = params.get('end') || sessionStorage.getItem('soru_takip_print_end_date') || '';
            
            const weekParam = params.get('week') || sessionStorage.getItem('soru_takip_print_week');
            selectedWeek = weekParam ? parseInt(weekParam, 10) : calculateSchoolWeek();

            // Varsayılan tarihler boşsa bu haftayı ata
            if (!selectedStartDate || !selectedEndDate) {
                const cur = getMondayAndSunday();
                selectedStartDate = cur.mon;
                selectedEndDate = cur.sun;
            }

            // Eğer tek ders seçildiyse ve bitiş tarihi 21 güne ayarlanmadıysa 21 güne tamamla
            if (selectedDers && selectedStartDate) {
                const parts = selectedStartDate.split('-');
                if (parts.length === 3) {
                    const s = new Date(parseInt(parts[0], 10), parseInt(parts[1], 10) - 1, parseInt(parts[2], 10));
                    const e = new Date(s);
                    e.setDate(s.getDate() + 20); // 21 gün
                    selectedEndDate = e.toISOString().split('T')[0];
                }
            }

            // Eğer öğrenci parametresi varsa ve sınıf boşsa, öğrencinin sınıfını bul
            if (selectedStudentNo && !selectedClass) {
                const st = allStudents.find(s => String(s.no) === String(selectedStudentNo));
                if (st && st.sinif) selectedClass = st.sinif;
            }
        }

        // Sınıf Açılır Kutusunu Doldur
        function populateClassDropdown() {
            const classSelect = document.getElementById('sinif-secici');
            if (!classSelect) return;

            const classes = Array.from(new Set(allStudents.map(s => s.sinif).filter(Boolean))).sort();
            classSelect.innerHTML = '<option value="">Tüm Sınıflar</option>';
            classes.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c;
                opt.textContent = c;
                classSelect.appendChild(opt);
            });

            if (selectedClass && classes.includes(selectedClass)) {
                classSelect.value = selectedClass;
            } else if (classes.length > 0 && !selectedClass && !selectedStudentNo) {
                selectedClass = classes[0];
                classSelect.value = selectedClass;
            }
        }

        // Öğrenci Açılır Kutusunu Doldur
        function populateStudentDropdown() {
            const studentSelect = document.getElementById('ogrenci-secici');
            if (!studentSelect) return;

            studentSelect.innerHTML = '';

            const norm = s => String(s || '').replace(/[\/_-]/g, '').trim().toUpperCase();
            let filtered = allStudents;
            if (selectedClass) {
                filtered = allStudents.filter(s => s.sinif === selectedClass || norm(s.sinif) === norm(selectedClass));
            }

            // Toplu form seçeneği
            const allOpt = document.createElement('option');
            allOpt.value = '__ALL__';
            allOpt.textContent = selectedClass 
                ? `👥 ${selectedClass} Sınıfı (${filtered.length} Öğrenci - Toplu Formlar)`
                : `👥 Tüm Sınıf (Toplu Formlar - ${filtered.length} Öğrenci)`;
            studentSelect.appendChild(allOpt);

            // Boş şablon seçeneği
            const blankOpt = document.createElement('option');
            blankOpt.value = '';
            blankOpt.textContent = '📄 Boş Şablon (Öğrencisiz)';
            studentSelect.appendChild(blankOpt);

            // Tekil öğrenciler
            filtered.slice().sort((a, b) => (parseInt(a.no) || 0) - (parseInt(b.no) || 0)).forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.no;
                opt.textContent = `${s.no} - ${s.adSoyad}${selectedClass ? '' : ' (' + (s.sinif || '') + ')'}`;
                studentSelect.appendChild(opt);
            });

            if (selectedStudentNo) {
                studentSelect.value = selectedStudentNo;
            } else {
                studentSelect.value = '__ALL__';
            }
        }

            selectedClass = cls;

            populateStudentDropdown();
            renderPages();

        // Sayfaları Render Et
        function renderPages(forceBlank = false) {
            const container = document.getElementById('pages-container');
            const bannerText = document.getElementById('banner-text');
            const printBtn = document.getElementById('btn-print-main');
            if (!container) return;

            container.innerHTML = '';

            const studentSelect = document.getElementById('ogrenci-secici');
            const mode = forceBlank ? '' : (studentSelect ? studentSelect.value : selectedStudentNo);

            const norm = s => String(s || '').replace(/[\/_-]/g, '').trim().toUpperCase();
            let targetStudents = [];

            const dersDesc = selectedDers ? ` &middot; 📘 Ders: ${selectedDers} (21 Günlük Form)` : ' &middot; 📚 Tüm Dersler (Karma / 7 Gün)';
            const periodDesc = (selectedStartDate && selectedEndDate) 
                ? `${formatDateTR(selectedStartDate)} - ${formatDateTR(selectedEndDate)} (${selectedWeek}. Hf)${dersDesc}`
                : `${selectedWeek}. Hafta${dersDesc}`;

            if (mode === '' || forceBlank) {
                targetStudents = [null];
                if (bannerText) bannerText.innerHTML = `<i class="fas fa-file"></i> 1 Adet Boş Şablon &middot; 📅 ${periodDesc}`;
                if (printBtn) printBtn.innerHTML = '<i class="fas fa-print"></i> Boş Formu Yazdır (1 Sayfa)';
            } else if (mode === '__ALL__') {
                if (selectedClass) {
                    targetStudents = allStudents.filter(s => s.sinif === selectedClass || norm(s.sinif) === norm(selectedClass));
                } else {
                    targetStudents = allStudents;
                }
                targetStudents.sort((a, b) => (parseInt(a.no) || 0) - (parseInt(b.no) || 0));

                if (targetStudents.length === 0) {
                    targetStudents = [null];
                    if (bannerText) bannerText.innerHTML = '<i class="fas fa-exclamation-triangle"></i> Bu sınıfta kayıtlı öğrenci bulunamadı (Boş şablon açıldı)';
                    if (printBtn) printBtn.innerHTML = '<i class="fas fa-print"></i> Formu Yazdır (1 Sayfa)';
                } else {
                    if (bannerText) bannerText.innerHTML = `<i class="fas fa-layer-group"></i> <strong>${selectedClass || 'Tüm'} Sınıfı:</strong> ${targetStudents.length} A4 Sayfası Hazır &middot; 📅 ${periodDesc}`;
                    if (printBtn) printBtn.innerHTML = `<i class="fas fa-print"></i> Formları Yazdır (${targetStudents.length} Sayfa)`;
                }
            } else {
                const singleStudent = allStudents.find(s => String(s.no) === String(mode));
                targetStudents = singleStudent ? [singleStudent] : [null];

                if (singleStudent) {
                    if (bannerText) bannerText.innerHTML = `<i class="fas fa-user-check"></i> <strong>${singleStudent.adSoyad}</strong> (${singleStudent.sinif || ''}) - 1 A4 Sayfası Hazır &middot; 📅 ${periodDesc}`;
                    if (printBtn) printBtn.innerHTML = `<i class="fas fa-print"></i> Formu Yazdır (1 Sayfa)`;
                }
            }

            // HTML Üretimi
            targetStudents.forEach((st, idx) => {
                container.insertAdjacentHTML('beforeend', generateSinglePageHTML(st, idx));
            });

            // Dinamik QR Kodlarını Üret
            targetStudents.forEach((st, idx) => {
                const qrBox = document.getElementById(`qr-box-${idx}`);
                if (!qrBox) return;
                qrBox.innerHTML = '';

                let baseUrl = "https://mraokul-hub.github.io/ProjeTabanliDersIsleme";
                if (window.location.origin && window.location.origin.startsWith('http')) {
                    baseUrl = window.location.origin + window.location.pathname.substring(0, window.location.pathname.lastIndexOf('/'));
                }

                const dersQuery = selectedDers ? `&ders=${encodeURIComponent(selectedDers)}` : '';
                let targetUrl = '';
                if (st && st.no) {
                    targetUrl = `${baseUrl}/veli-form.html?uid=${encodeURIComponent(teacherUid)}&sid=${encodeURIComponent(st.no)}&sname=${encodeURIComponent(st.adSoyad || '')}&start=${encodeURIComponent(selectedStartDate)}&end=${encodeURIComponent(selectedEndDate)}&week=${encodeURIComponent(selectedWeek)}${dersQuery}`;
                } else {
                    targetUrl = `${baseUrl}/veli-form.html?uid=${encodeURIComponent(teacherUid)}&start=${encodeURIComponent(selectedStartDate)}&end=${encodeURIComponent(selectedEndDate)}&week=${encodeURIComponent(selectedWeek)}${dersQuery}`;
                }

                if (typeof QRCode !== 'undefined') {
                    try {
                        new QRCode(qrBox, {
                            text: targetUrl,
                            width: 52,
                            height: 52,
                            colorDark: "#000000",
                            colorLight: "#ffffff",
                            correctLevel: QRCode.CorrectLevel.M
                        });
                    } catch (err) {
                        renderFallbackBarcode(qrBox, st ? st.no : '00');
                    }
                } else {
                    renderFallbackBarcode(qrBox, st ? st.no : '00');
                }
            });
        }

                <div class="fiducial-target fiducial-br" title="BR Marker"></div>

                <!-- KENAR HİZALAMA ÇENTİKLERİ (AXIS TIMING TICKS) -->
                <div class="tick-h tick-top-1"></div>
                <div class="tick-h tick-top-2"></div>
                <div class="tick-h tick-bottom-1"></div>
                <div class="tick-h tick-bottom-2"></div>
                <div class="tick-v tick-left-1"></div>
                <div class="tick-v tick-left-2"></div>
                <div class="tick-v tick-right-1"></div>
                <div class="tick-v tick-right-2"></div>

                <!-- ── FORM ÜST BİLGİ & METADATA ALANI (QR VE TARİH ENTEGRELİ) ── -->
                <div class="header-section">
                    <div class="header-main-col">
                        <div class="header-top">
                            <div class="header-titles">
                                <h1>${formH1}</h1>
                                <h2>${formH2}</h2>
                            </div>
                            <div class="header-period-badge" title="Veri Girişi Takip Dönemi">
                                ${badgeContent}
                            </div>
                        </div>

                        <div class="header-fields">
                            <div class="field-group" style="flex: 1.4;">
                                <span class="field-lbl">ÖĞRENCİ ADI SOYADI:</span>
                                <div class="field-line">${nameText ? nameText : '&nbsp;'}</div>
                            </div>

                            <div class="field-group">
                                <span class="field-lbl">ÖĞRENCİ NO:</span>
                                <div class="field-comb">
                                    ${noCombsHTML}
                                </div>
                            </div>

                            <div class="field-group">
                                <span class="field-lbl">SINIF / ŞUBE:</span>
                                <div class="field-comb">
                                    ${sinifCombsHTML}
                                </div>
                            </div>

                            <div class="field-group" style="flex: 0.9;">
                                <span class="field-lbl">DERS:</span>
                                <div class="header-ders-field">
                                    ${selectedDers ? selectedDers.toUpperCase() : 'TÜM DERSLER'}
                                </div>
                            </div>

                            <div class="field-group">
                                <span class="field-lbl">TAKİP HAFTASI:</span>
                                <div class="field-comb">
                                    ${weekCombsHTML}
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- SAĞ KOLON: DİNAMİK QR KOD & BARKOD ETİKETİ -->
                    <div class="header-qr-col">
                        <div class="qr-code-box" id="qr-box-${pageIndex}" title="Kameraya okutarak doğrudan öğrenci sayfasına gidin"></div>
                        <div class="qr-code-tag">ST-${studentCode}-W${String(selectedWeek).padStart(2,'0')}${dersTag}</div>
                        <div class="qr-code-hint">TARATIP VERİ GİR</div>
                    </div>
                </div>

                <!-- ── OPTİK SORU ÇÖZÜM TABLOSU (21 SATIR) ── -->
                <div class="table-wrap">
                    <table class="tracking-table">
                        <thead>
                            <tr>
                                <th class="col-sira">#</th>
                                <th class="col-tarih">TARİH</th>
                                <th class="col-ders">DERS</th>
                                <th class="col-kaynak">KAYNAK KİTAP / KONU</th>
                                <th class="col-tip">SORU TİPİ<br><span style="font-size:7.5px; font-weight:500;">(T / YN / K)</span></th>
                                <th class="col-dyb">✅ DOĞRU</th>
                                <th class="col-dyb">❌ YANLIŞ</th>
                                <th class="col-dyb">⬜ BOŞ</th>
                                <th class="col-os">🙋 ÖĞR.<br>SORU</th>
                            </tr>
                        </thead>
                        <tbody>
                            ${generateTableRowsHTML()}
                        </tbody>
                    </table>
                </div>

                <!-- ── FORM ALTI & OCR KALİBRASYON ŞERİDİ ── -->
                <div class="footer-section">
                    <div class="footer-left">
                        <div class="footer-rules">
                            📌 <strong>OCR & Veli Bilgilendirme:</strong> Rakamları 2 haneli kutucuklara net yazınız (Örn: 05, 18). Soru tipini <strong>[T]</strong> Temel, <strong>[YN]</strong> Yeni Nesil veya <strong>[K]</strong> Karışık yuvarlak içine alınız.
                        </div>
                        <div class="footer-sub">
                            * Sağ üstteki QR kodu telefon kamerasıyla taratarak haftalık verileri doğrudan girebilirsiniz. WhatsApp paylaşımı gerektirmez.
                        </div>
                    </div>

                    <div class="calibration-strip" title="Optik Binarizasyon Kalibratörü (0% - 100%)">
                        <div class="cal-box cal-0"></div>
                        <div class="cal-box cal-20"></div>
                        <div class="cal-box cal-40"></div>
                        <div class="cal-box cal-60"></div>
                        <div class="cal-box cal-80"></div>
                        <div class="cal-box cal-100"></div>
                    </div>

                    <div class="system-seal">
                        PROJE-AI &middot; 2026
                    </div>
                </div>
            </div>
            `;
        }
    </script>
</body>
</html>
