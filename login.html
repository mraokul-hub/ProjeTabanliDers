<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giriş Yap - Proje Tabanlı Ders İşleme Sistemi</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🛡️</text></svg>">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Firebase Compat SDKs -->
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-database-compat.js"></script>
    <script src="firebase-config.js"></script>
    
    <style>
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            transition: background-color 0.3s ease;
            margin: 0;
        }

        .auth-card {
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(10px);
            width: 100%;
            max-width: 400px;
            overflow: visible;
            margin-top: 60px;
            position: relative;
        }

        .logo-container {
            width: 110px;
            height: 110px;
            background: #1e293b;
            border-radius: 50%;
            position: absolute;
            top: -55px;
            left: 50%;
            transform: translateX(-50%);
            padding: 0;
            overflow: hidden;
            border: 4px solid #3b82f6;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 10;
            animation: popIn 0.6s cubic-bezier(0.68, -0.55, 0.27, 1.55);
            font-size: 50px;
        }

        @keyframes popIn {
            0% {
                transform: translateX(-50%) scale(0);
                opacity: 0;
            }
            100% {
                transform: translateX(-50%) scale(1);
                opacity: 1;
            }
        }

        .card-body {
            padding-top: 70px;
            padding-bottom: 30px;
            padding-left: 30px;
            padding-right: 30px;
            text-align: center;
        }

        .form-control {
            background: #0f172a !important;
            border-color: #334155 !important;
            color: #f8fafc !important;
        }
        
        .input-group-text {
            background: #0f172a !important;
            border-color: #334155 !important;
            color: #94a3b8 !important;
        }

        .form-control:focus {
            box-shadow: 0 0 0 0.25rem rgba(59, 130, 246, 0.25);
            border-color: #3b82f6 !important;
        }
        
        .form-control::placeholder {
            color: #64748b;
        }

        .btn-login {
            background-color: #3b82f6;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            transition: 0.3s;
            width: 100%;
            border-radius: 10px;
        }

        .btn-login:hover {
            background-color: #2563eb;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(59, 130, 246, 0.3);
        }

        .footer-link a {
            color: #38bdf8;
            text-decoration: none;
            font-weight: 600;
        }

        .footer-link a:hover {
            text-decoration: underline;
        }

        .footer-signature {
            position: absolute;
            bottom: 0;
            width: 100%;
            text-align: center;
            padding: 15px;
            font-size: 0.85rem;
            color: #94a3b8;
            background: rgba(15, 23, 42, 0.8);
            border-top: 1px solid #334155;
        }
    </style>
</head>

<body>

    <div class="container d-flex justify-content-center">
        <div class="card auth-card">
            <div class="logo-container">
                🛡️
            </div>

            <div class="card-body">
                <h3 class="fw-bold mb-1" style="color: #f8fafc;">Hoş Geldiniz</h3>
                <p class="small mb-4" style="color: #94a3b8;">Proje Tabanlı Ders İşleme Sistemi</p>

                <div id="alertBox" class="alert alert-danger d-none text-center p-2 small"></div>

                <form id="loginForm" class="text-start">
                    <div class="mb-3">
                        <label class="form-label fw-bold small" style="color: #94a3b8;">E-posta</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0"><i class="fa-solid fa-envelope"></i></span>
                            <input type="email" id="email" class="form-control border-start-0" placeholder="ornek@mail.com" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small" style="color: #94a3b8;">Şifre</label>
                        <div class="input-group">
                            <span class="input-group-text border-end-0"><i class="fa-solid fa-lock"></i></span>
                            <input type="password" id="password" class="form-control border-start-0" placeholder="******" required>
                        </div>
                    </div>
                    <div class="d-grid">
                        <button type="submit" id="loginBtn" class="btn btn-primary btn-login fw-bold text-white">
                            Giriş Yap
                        </button>
                    </div>
                </form>

                <div class="footer-link mt-4 small" style="color: #64748b;">
                    Hesabınız yok mu? <a href="register.html">Hemen Kaydolun</a>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="footer-signature">
        <p class="mb-1 fw-bold">© 2026 Yabgu Eğitim Sistemi</p>
    </footer>

    <script>
        const auth = firebase.auth();
        const db = firebase.database();
        const alertBox = document.getElementById('alertBox');
        const loginBtn = document.getElementById('loginBtn');

        auth.onAuthStateChanged(user => {
            if (user) {
                if (user.email === 'mremzi@gmail.com') {
                    window.location.href = 'Proje Tabanlı Ders işleme.html';
                } else {
                    db.ref("kullanicilar/" + user.uid).once("value").then(snapshot => {
                        if (snapshot.exists() && snapshot.val().onayli === true) {
                            window.location.href = 'Proje Tabanlı Ders işleme.html';
                        } else {
                            auth.signOut();
                            showAlert("Hesabınız henüz yönetici tarafından onaylanmamış.", "warning");
                            loginBtn.disabled = false;
                            loginBtn.innerHTML = 'Giriş Yap';
                        }
                    }).catch(err => {
                        console.error(err);
                        auth.signOut();
                        showAlert("Kullanıcı bilgileri alınırken hata oluştu.");
                        loginBtn.disabled = false;
                        loginBtn.innerHTML = 'Giriş Yap';
                    });
                }
            }
        });

        function showAlert(msg, type = 'danger') {
            alertBox.textContent = msg;
            alertBox.className = `alert alert-${type} text-center p-2 small`;
            alertBox.classList.remove('d-none');
        }

        document.getElementById('loginForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            loginBtn.disabled = true;
            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Giriş Yapılıyor...';

            auth.signInWithEmailAndPassword(email, password)
                .catch((error) => {
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = 'Giriş Yap';
                    let msg = "Giriş hatası: " + error.message;
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password') msg = "E-posta veya şifre hatalı.";
                    showAlert(msg);
                });
        });
    </script>
</body>
</html>
